# License policy: permissive only. GPL/AGPL/LGPL are denied; MPL-2.0 is
# deliberately NOT allowed (decision pending, see AGENTS.md / the plan).
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
    # `paste` is unmaintained but only a proc-macro pulled in by ratatui 0.29.
    # Revisit when upgrading ratatui.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via ratatui; no vulnerability" },
]
