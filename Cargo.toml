[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/skink"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xuckless/skink"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Low memory / fast start: small, fully optimised, single binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The ACP client, prompter and EveryAI host client are I/O-bound (an agent is seconds away), so
# size beats speed there: this keeps the binary under the 15 MB budget.
[profile.release.package.skink-ai]
opt-level = "z"

[profile.release.package.skink-host]
opt-level = "z"

# The debug adapter client waits on another process too.
[profile.release.package.skink-dap]
opt-level = "z"

# wasmtime runs package grammars (tree-sitter WASM). Each grammar compiles once, on a worker,
# so size beats speed: opt-level 3 costs +9.4 MB, "z" +4.9 MB (measured 2026-11-10).
[profile.release.package.cranelift-assembler-x64]
opt-level = "z"

[profile.release.package.cranelift-bforest]
opt-level = "z"

[profile.release.package.cranelift-bitset]
opt-level = "z"

[profile.release.package.cranelift-codegen]
opt-level = "z"

[profile.release.package.cranelift-codegen-shared]
opt-level = "z"

[profile.release.package.cranelift-control]
opt-level = "z"

[profile.release.package.cranelift-entity]
opt-level = "z"

[profile.release.package.cranelift-frontend]
opt-level = "z"

[profile.release.package.cranelift-native]
opt-level = "z"

[profile.release.package.gimli]
opt-level = "z"

[profile.release.package.object]
opt-level = "z"

[profile.release.package.pulley-interpreter]
opt-level = "z"

[profile.release.package.regalloc2]
opt-level = "z"

[profile.release.package.wasm-encoder]
opt-level = "z"

[profile.release.package.wasmparser]
opt-level = "z"

[profile.release.package.wasmprinter]
opt-level = "z"

[profile.release.package.wasmtime]
opt-level = "z"

[profile.release.package.wasmtime-c-api-impl]
opt-level = "z"

[profile.release.package.wasmtime-environ]
opt-level = "z"

[profile.release.package.wasmtime-internal-component-util]
opt-level = "z"

[profile.release.package.wasmtime-internal-core]
opt-level = "z"

[profile.release.package.wasmtime-internal-cranelift]
opt-level = "z"

[profile.release.package.wasmtime-internal-jit-icache-coherence]
opt-level = "z"

[profile.release.package.wasmtime-internal-unwinder]
opt-level = "z"

[profile.release.package.postcard]
opt-level = "z"

[profile.release.package.target-lexicon]
opt-level = "z"
