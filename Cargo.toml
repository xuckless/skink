[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/skink"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xuckless/skink"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Low memory / fast start: small, fully optimised, single binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The ACP client, prompter and EveryAI host client are I/O-bound (an agent is seconds away), so
# size beats speed there: this keeps the binary under the 15 MB budget.
[profile.release.package.skink-ai]
opt-level = "z"

[profile.release.package.skink-host]
opt-level = "z"
