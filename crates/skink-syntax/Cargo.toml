[package]
name = "skink-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tree-sitter syntax highlighting for Skink (UI-free)"

[dependencies]
streaming-iterator = "0.1"
tree-sitter = { version = "0.27", default-features = false }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[features]
default = ["rust", "typescript", "javascript", "python", "go", "zig", "json", "toml", "bash"]
rust = ["dep:tree-sitter-rust"]
# TypeScript and TSX share one grammar crate and the JS highlight queries.
typescript = ["dep:tree-sitter-typescript", "javascript"]
javascript = ["dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
go = ["dep:tree-sitter-go"]
zig = ["dep:tree-sitter-zig"]
json = ["dep:tree-sitter-json"]
toml = ["dep:tree-sitter-toml-ng"]
bash = ["dep:tree-sitter-bash"]

[lints]
workspace = true
