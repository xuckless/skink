[package]
name = "skink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skink-ai = { version = "1.0.0", path = "../skink-ai" }
skink-config = { version = "1.0.0", path = "../skink-config" }
skink-core = { version = "1.0.0", path = "../skink-core" }
skink-host = { version = "1.0.0", path = "../skink-host" }
skink-lsp = { version = "1.0.0", path = "../skink-lsp" }
skink-syntax = { version = "1.0.0", path = "../skink-syntax" }
skink-term = { version = "1.0.0", path = "../skink-term" }
skink-ui = { version = "1.0.0", path = "../skink-ui" }

[features]
# Every grammar built in, including the ones that ship as packages by
# default (Zig, HTML, CSS, Lua, Make, INI, Diff, XML, Dart, C, C++, Java,
# C#, ...): `cargo install skink --features all-langs`.
all-langs = ["skink-syntax/all-langs"]
# Grammars installed from packages at run time (tree-sitter WASM via wasmtime,
# +4.5 MB). On through skink-syntax's defaults.
wasm = ["skink-syntax/wasm"]
# SVG preview in a tab (resvg, about +0.9 MB). On by default since the
# binary budget went to 20 MB; `--no-default-features` leaves it out.
default = ["svg-preview"]
svg-preview = ["skink-ui/svg-preview"]

[lints]
workspace = true
