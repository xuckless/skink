[package]
name = "skink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skink-ai = { version = "0.3.0", path = "../skink-ai" }
skink-config = { version = "0.3.0", path = "../skink-config" }
skink-core = { version = "0.3.0", path = "../skink-core" }
skink-host = { version = "0.3.0", path = "../skink-host" }
skink-lsp = { version = "0.3.0", path = "../skink-lsp" }
skink-syntax = { version = "0.3.0", path = "../skink-syntax" }
skink-term = { version = "0.3.0", path = "../skink-term" }
skink-ui = { version = "0.3.0", path = "../skink-ui" }

[features]
# Every grammar, including the big ones left out of the default build
# (C, C++, Java, C#, Ruby, PHP, SQL, Elixir, Dart, Haskell, Swift, Scala,
# Nix, Svelte): `cargo install skink --features all-langs`.
all-langs = ["skink-syntax/all-langs"]
# SVG preview in a tab (resvg, about +0.9 MB). On by default since the
# binary budget went to 20 MB; `--no-default-features` leaves it out.
default = ["svg-preview"]
svg-preview = ["skink-ui/svg-preview"]

[lints]
workspace = true
