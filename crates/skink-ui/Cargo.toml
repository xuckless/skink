[package]
name = "skink-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
ignore = "0.4"
minisign-verify = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.29.0"
resvg = { version = "0.49", default-features = false, optional = true }
sha2 = "0.10"
skink-ai = { version = "0.4.0", path = "../skink-ai" }
skink-config = { version = "0.4.0", path = "../skink-config" }
skink-core = { version = "0.4.0", path = "../skink-core" }
skink-host = { version = "0.4.0", path = "../skink-host" }
skink-lsp = { version = "0.4.0", path = "../skink-lsp" }
skink-syntax = { version = "0.4.0", path = "../skink-syntax" }
skink-term = { version = "0.4.0", path = "../skink-term" }
unicode-segmentation = "1"
unicode-width = "=0.2.0"

[features]
# SVG preview (:preview on an .svg): resvg without text or raster images,
# about +0.9 MB. The `skink` binary enables it by default.
svg-preview = ["dep:resvg"]

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
