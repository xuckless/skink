[package]
name = "skink-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
ignore = "0.4"
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.29.0"
resvg = { version = "0.49", default-features = false, optional = true }
sha2 = "0.10"
similar = { version = "3.2.1", default-features = false, features = ["text"] }
skink-ai = { version = "0.9.0", path = "../skink-ai" }
skink-config = { version = "0.9.0", path = "../skink-config" }
skink-core = { version = "0.9.0", path = "../skink-core" }
skink-dap = { version = "0.9.0", path = "../skink-dap" }
skink-host = { version = "0.9.0", path = "../skink-host" }
skink-lsp = { version = "0.9.0", path = "../skink-lsp" }
skink-syntax = { version = "0.9.0", path = "../skink-syntax" }
skink-term = { version = "0.9.0", path = "../skink-term" }
unicode-segmentation = "1"
unicode-width = "=0.2.0"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
mlua = { version = "0.10.5", features = ["lua54", "vendored"] }

[target.'cfg(unix)'.dependencies]
# poll(2) for the short terminal-background query at start (safe API;
# already built on Linux through arboard's x11rb).
rustix = { version = "1.1.6", default-features = false, features = ["std", "event"] }

[features]
# SVG preview (:preview on an .svg): resvg without text or raster images,
# about +0.9 MB. The `skink` binary enables it by default.
svg-preview = ["dep:resvg"]

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
