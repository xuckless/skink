name: Release

# Push a tag like v0.1.0 to build binaries for every platform and publish a
# GitHub release. Assets have version-less names so that
# https://github.com/xuckless/skink/releases/latest/download/<asset> always works
# (that is how install.sh / install.ps1 find them).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p skink --target ${{ matrix.target }}
        env:
          # Static C runtime on Windows: no VC++ redistributable needed.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="skink-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=skink; [[ "${{ matrix.target }}" == *windows* ]] && exe=skink.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/$name/"
          cd dist
          if [[ "$exe" == skink.exe ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            asset="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums + installers
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS
          cp ../install.sh ../install.ps1 .
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then echo "manual run: build only"; exit 0; fi
          gh release view "$tag" >/dev/null 2>&1 && gh release delete "$tag" --yes || true
          gh release create "$tag" assets/* --title "Skink $tag" --generate-notes \
            --notes "Install: \`curl -fsSL https://github.com/xuckless/skink/releases/latest/download/install.sh | sh\` (Linux/macOS) or \`irm https://github.com/xuckless/skink/releases/latest/download/install.ps1 | iex\` (Windows PowerShell)."

  verify-install:
    name: install check (${{ matrix.os }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Install with the public one-liner (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://github.com/xuckless/skink/releases/latest/download/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          skink --version
      - name: Install with the public one-liner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://github.com/xuckless/skink/releases/latest/download/install.ps1 | iex
          & "$env:LOCALAPPDATA\Programs\skink\bin\skink.exe" --version
