name: Website

# Builds the site and deploys it to https://skink.cc (Cloudflare Workers static
# assets). The old GitHub Pages address keeps serving pages that redirect to
# skink.cc.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/skink-ui/src/help/**'
      - 'crates/skink-ui/src/help.rs'
      - 'crates/skink-ui/src/commands.rs'
      - 'crates/skink-config/src/lib.rs'
      - 'crates/skink-core/src/command.rs'
      - 'Cargo.toml'
      - 'registry/verified.json'
      - '.github/workflows/pages.yml'
  # Daily: the package index (/packages/) picks up new skink-plugin repos.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap <lastmod> comes from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Shortcuts, commands and the manual are extracted from the Rust sources
      # here; the package index is built from GitHub (search, releases).
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare (skink.cc)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/gh-redirects.mjs dist gh-redirects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/gh-redirects

  redirects:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
